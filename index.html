<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ---------- Apple system palette ---------- */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sheet:#F2F2F7; --sheet-card:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12); --fill2:rgba(116,116,128,.08);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --material:rgba(249,249,249,.8); --seg-on:#FFFFFF; --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --scrim:rgba(0,0,0,.4);
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#000000; --card:#1C1C1E; --sheet:#1C1C1E; --sheet-card:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.18);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --material:rgba(22,22,24,.78); --seg-on:#636366; --seg-shadow:0 3px 8px rgba(0,0,0,.12);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:var(--label);letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}
.l2{color:var(--label2)} .l3{color:var(--label3)}
.pos{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
.sm{font-size:13px;letter-spacing:0}

/* ---------- navigation bar (material) ---------- */
.nav{position:sticky;top:0;z-index:10;height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;gap:2px;
  background:var(--bg);transition:background .2s,box-shadow .2s}
.nav.scrolled{background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.chev{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.chev svg{width:12px;height:20px}
.chev:active,.sec-a:active,.txtbtn:active{opacity:.35}
.mlabel{min-width:150px;text-align:center;font-weight:600;font-size:17px}
.mlabel small{display:block;font-weight:400;font-size:12px;color:var(--label2);margin-top:-1px;letter-spacing:0}

main{max-width:640px;margin:0 auto;padding:0 16px 24px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em;margin:2px 0 14px}

/* ---------- inset grouped lists ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 7px;font-size:13px;line-height:18px;letter-spacing:0;color:var(--label2);text-transform:uppercase}
.sec-h .v{text-transform:none;font-variant-numeric:tabular-nums}
.sec-a{text-transform:none;color:var(--blue);font-size:15px}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:30px}
.foot{font-size:13px;color:var(--label2);padding:0 16px;margin:-23px 0 30px;letter-spacing:0}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative;width:100%;text-align:left}
.row+.row::before,.list>details+details::before,.list>.row+details::before,.list>details+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.list>details{position:relative}
.list.ic{--inset:58px}
.tap{transition:background .25s}
.tap:active{background:var(--fill2);transition:none}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;letter-spacing:0;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .a{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .a small{display:block;font-size:13px;color:var(--label2);letter-spacing:0}
.disc{width:8px;height:13px;color:var(--label3);flex:0 0 auto}
.tile{width:30px;height:30px;border-radius:7px;background:var(--fill2);display:grid;place-items:center;font-size:17px;flex:0 0 auto;line-height:1}
.pad{padding:12px 16px 14px}
.add-row{color:var(--blue)}
.add-row .tile{background:transparent;color:var(--blue);font-size:24px;font-weight:300}

/* ---------- overview ---------- */
.hero{padding:0 2px 26px}
.hero .cap{font-size:15px;color:var(--label2);letter-spacing:0}
.hero .big{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:2px 0 8px}
.hero .flows{display:flex;gap:16px;font-size:15px;letter-spacing:0}
.hero .flows span{display:inline-flex;align-items:center;gap:4px}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--blue);transition:width .5s var(--ease)}
.bar>i.warn{background:var(--orange)} .bar>i.over{background:var(--red)} .bar>i.good{background:var(--green)}
.bar.lg{height:6px;border-radius:3px}
.spl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio>div{padding:11px 14px}
.trio>div+div{box-shadow:inset .5px 0 0 var(--sep)}
.trio .k{font-size:13px;color:var(--label2);letter-spacing:0}
.trio .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.empty{color:var(--label2);text-align:center;padding:36px 16px;font-size:15px;letter-spacing:0}
.empty .big{font-size:34px;margin-bottom:6px}

/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:22px;position:relative}
.seg button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:0;white-space:nowrap;position:relative;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--seg-on);box-shadow:var(--seg-shadow);font-weight:600}
.seg button+button::before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:1px;background:var(--label3);opacity:.5;transition:opacity .2s}
.seg button.on::before,.seg button.on+button::before{opacity:0}

/* ---------- ODDS ---------- */
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details .disc{transition:transform .25s var(--ease)}
details[open] .disc{transform:rotate(90deg)}
.sub .row{padding-left:58px;font-size:15px;letter-spacing:0}
.sub .row::before{left:58px!important}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;font-size:13px;letter-spacing:0;min-width:100%}
.tbl th,.tbl td{padding:9px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr+tr td{box-shadow:inset 0 .5px 0 var(--sep)}
.tbl th{color:var(--label2);font-weight:500}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);color:var(--label2)}

/* ---------- tab bar (material) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
  background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 -.5px 0 var(--sep);padding:0 0 env(safe-area-inset-bottom)}
.tab{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.01em;color:#999}
[data-theme=dark] .tab{color:#8E8E93}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--blue)}
.tab.plus{color:var(--blue)}
.tab.plus svg{width:30px;height:30px}
.tab:active svg{transform:scale(.9)}
.tab svg{transition:transform .15s}

/* ---------- modal sheet ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(10px + env(safe-area-inset-top));z-index:31;background:var(--sheet);border-radius:12px 12px 0 0;
  transform:translateY(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;max-width:640px;margin:0 auto;visibility:hidden;
  --card:var(--sheet-card)}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:0 0 auto}
.sh-nav{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 16px;flex:0 0 auto;touch-action:none}
.sh-nav .ttl{font-weight:600;font-size:17px}
.txtbtn{color:var(--blue);font-size:17px;min-width:72px;text-align:left;height:44px}
.txtbtn.b{font-weight:600;text-align:right}
.txtbtn:disabled{color:var(--label3)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 22px}
.amount input{border:0;outline:0;background:transparent;font-size:56px;line-height:1.1;font-weight:600;letter-spacing:-.035em;text-align:center;width:100%;min-width:0;font-variant-numeric:tabular-nums;caret-color:var(--blue)}
.amount input::placeholder{color:var(--label3)}
.amount span{font-size:34px;font-weight:500;color:var(--label3)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-bottom:28px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:0;line-height:1.2;color:var(--label);text-align:center}
.cat .ct{width:56px;height:56px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:26px;transition:transform .15s,box-shadow .2s,background .2s}
.cat:active .ct{transform:scale(.92)}
.cat.on .ct{background:color-mix(in srgb,var(--blue) 14%,var(--card));box-shadow:0 0 0 2px var(--blue)}
.cat.on{color:var(--blue);font-weight:600}
.cat .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:80px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 28px;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:15px;letter-spacing:0;display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap;transition:background .2s,color .2s}
.pill.on{background:var(--blue);color:#fff}
.pill:disabled{opacity:.35}
.pill:active{opacity:.6}
.pill input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.field-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative}
.field-row+.field-row::before{content:"";position:absolute;top:0;right:0;left:16px;height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.field-row label{flex:0 0 auto;min-width:110px}
.field-row input{flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;padding:11px 0;color:var(--label)}
.field-row input::placeholder{color:var(--label3)}
.danger{color:var(--red);justify-content:center}
.field-row input.sw{flex:0 0 51px;padding:0}
.sw{position:relative;width:51px;height:31px;flex:0 0 auto;-webkit-appearance:none;appearance:none;background:var(--fill);border-radius:16px;transition:background .25s;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s var(--ease)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px}
.emojis button{height:44px;border-radius:10px;font-size:24px;display:grid;place-items:center}
.emojis button.on{background:color-mix(in srgb,var(--blue) 16%,transparent);box-shadow:inset 0 0 0 2px var(--blue)}

/* ---------- misc ---------- */
.hud{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:50;transform:translate(-50%,-140%);
  background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 8px 30px rgba(0,0,0,.12),0 0 0 .5px var(--sep);color:var(--label);
  padding:11px 20px;border-radius:22px;font-size:15px;font-weight:600;letter-spacing:0;max-width:88vw;text-align:center;transition:transform .45s var(--ease)}
.hud.on{transform:translate(-50%,0)}
.screen{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.screen .big{font-size:56px}
.screen h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:12px 0 6px}
.screen p{color:var(--label2);max-width:320px;font-size:15px;letter-spacing:0;margin:0}
.btn{background:var(--blue);color:#fff;height:50px;padding:0 28px;border-radius:14px;font-weight:600;margin-top:22px;display:inline-flex;align-items:center;text-decoration:none}
.btn:active{opacity:.7}
code{background:var(--card);padding:2px 8px;border-radius:6px;font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all}
.skel{background:var(--card);border-radius:12px;margin-bottom:30px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.5}}
.sync{width:6px;height:6px;border-radius:50%;background:var(--label3);display:inline-block;margin-left:6px;vertical-align:middle;opacity:0;transition:opacity .2s}
.sync.on{opacity:1;animation:sk 1s infinite}
.demo{background:var(--orange);color:#fff;text-align:center;font-size:12px;padding:3px;font-weight:600;letter-spacing:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .nav.scrolled,.tabs,.hud{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Демо — данные ненастоящие и не сохраняются</div>
<header class="nav" id="nav">
  <button class="chev" data-act="month" data-v="-1" aria-label="Предыдущий месяц"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
  <div class="mlabel" id="mlabel">…</div>
  <button class="chev" data-act="month" data-v="1" aria-label="Следующий месяц"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg></button>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="8.5" height="8.5" rx="2.2"/><rect x="15.5" y="4" width="8.5" height="8.5" rx="2.2"/><rect x="4" y="15.5" width="8.5" height="8.5" rx="2.2"/><rect x="15.5" y="15.5" width="8.5" height="8.5" rx="2.2"/></svg>Обзор</button>
  <button class="tab" data-act="tab" data-v="ops"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 7.5h14M10 14h14M10 20.5h14"/><circle cx="5.2" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="5.2" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="5.2" cy="20.5" r="1.3" fill="currentColor" stroke="none"/></svg>Операции</button>
  <button class="tab plus" data-act="new" aria-label="Новая операция"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="currentColor"/><path d="M14 8.5v11M8.5 14h11" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <button class="tab" data-act="tab" data-v="pf"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="14" cy="14" r="10"/><path d="M14 4v10l7 7"/></svg>План-факт</button>
  <button class="tab" data-act="tab" data-v="odds"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 23V5M9 5 4.5 9.5M9 5l4.5 4.5M19 5v18M19 23l-4.5-4.5M19 23l4.5-4.5"/></svg>ОДДС</button>
</nav>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"></div>
  <div class="sh-nav" id="shNav">
    <button class="txtbtn" data-act="close">Отменить</button>
    <div class="ttl" id="shTitle"></div>
    <button class="txtbtn b" id="shDone" data-act="done">Готово</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</section>
<div class="hud" id="hud"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const qs = new URLSearchParams(location.search);
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let API = qs.get('api');
if (API) LS.set('fb_api', API); else API = LS.get('fb_api');
const DEMO = qs.has('demo');

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SH = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => isoOf(new Date());
const yesterday = () => isoOf(new Date(Date.now()-864e5));
const mAdd = (key,k) => { const d = new Date(+key.slice(0,4), +key.slice(5,7)-1+k, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const mLabel = key => MONTHS[+key.slice(5,7)-1]+' '+key.slice(0,4);
const mShort = key => MONTHS_SH[+key.slice(5,7)-1]+' '+key.slice(2,4);
const dLabel = iso => iso===today() ? 'Сегодня' : iso===yesterday() ? 'Вчера' : (+iso.slice(8,10))+' '+MONTHS_GEN[+iso.slice(5,7)-1];
const nf = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money = (n, sign) => { const v = Math.round(n*100)/100; return (sign && v>0 ? '+' : v<0 ? '−' : '') + nf.format(Math.abs(v)) + ' ₽'; };
const sum = (a,f) => a.reduce((s,x)=>s+(f?f(x):x),0);
const uniq = a => a.filter((x,i)=>a.indexOf(x)===i);
const akey = (g,a) => g+'|'+a;
const DISC = '<svg class="disc" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>';
const WALLET_ICONS = ['💳','🏦','💵','💰','🪙','🐷','📈','💎','🏠','🚗','✈️','🎁'];

let D = null;
const S = { tab:'home', month: today().slice(0,7), opsFilter:'all', pfType:'Расход', odds:'month', busy:false, saving:false };
let F = null;      // состояние открытой формы
let mode = null;   // 'op' | 'wallet'

function applyTheme(){
  const dark = inTg && tg.colorScheme ? tg.colorScheme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try{

      const bg = dark ? '#000000' : '#F2F2F7';
      tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
      if (tg.isVersionAtLeast('7.10') && tg.setBottomBarColor) tg.setBottomBarColor(dark ? '#161618' : '#F9F9F9');
    }
  }catch(e){}

/* ------------------------------ API ------------------------------ */
async function api(action, payload){
  if (DEMO) return demoApi(action, payload);
  const r = await fetch(API, { method:'POST', body: JSON.stringify({ action, payload, initData: tg ? tg.initData : '' }) });
  const j = await r.json();
  if (!j.ok){ const e = new Error(j.error || 'Ошибка сервера'); e.code = j.code; e.tgId = j.id; throw e; }
  return j.data;
}

/* --------------------------- расчёты --------------------------- */
const artIcon = (g,a) => { const x = D.articles.find(z=>z.group===g&&z.name===a); return (x&&x.icon) || '•'; };

function balances(){
  const m = {};
  D.wallets.forEach(w => m[w.name] = w.initial || 0);
  D.ops.forEach(o => {
    if (o.type==='Доход') m[o.wallet] = (m[o.wallet]||0) + o.amount;
    else if (o.type==='Расход') m[o.wallet] = (m[o.wallet]||0) - o.amount;
    else { m[o.wallet] = (m[o.wallet]||0) - o.amount; m[o.wallet2] = (m[o.wallet2]||0) + o.amount; }
  });
  return m;
}
const opsOfMonth = key => D.ops.filter(o => o.date.slice(0,7)===key);

function planFact(key, type){
  const ops = opsOfMonth(key).filter(o=>o.type===type);
  const plan = D.budget[key] || {};
  const fact = {};
  ops.forEach(o => { const k = akey(o.group,o.article); fact[k] = (fact[k]||0) + o.amount; });
  const arts = D.articles.filter(a => a.type===type && (a.active || plan[akey(a.group,a.name)] || fact[akey(a.group,a.name)]));
  const groups = uniq(arts.map(a=>a.group)).map(g => {
    const items = arts.filter(a=>a.group===g).map(a => ({ ...a, plan: plan[akey(g,a.name)]||0, fact: fact[akey(g,a.name)]||0 }))
      .sort((x,y)=> (y.fact - x.fact) || (y.plan - x.plan));
    return { group:g, items, plan: sum(items,i=>i.plan), fact: sum(items,i=>i.fact) };
  });
  return { groups, plan: sum(groups,g=>g.plan), fact: sum(groups,g=>g.fact) };
}

function oddsRange(){
  const m = S.month;
  if (S.odds==='month') return [m,m];
  if (S.odds==='quarter'){ const y=m.slice(0,4), q=Math.floor((+m.slice(5,7)-1)/3); return [y+'-'+pad(q*3+1), y+'-'+pad(q*3+3)]; }
  if (S.odds==='year') return [m.slice(0,4)+'-01', m.slice(0,4)+'-12'];
  const first = D.ops.reduce((mn,o)=> o.date.slice(0,7)<mn ? o.date.slice(0,7) : mn, m);
  return [first, m];
}
function odds(from, to){
  let start = sum(D.wallets, w=>w.initial||0);
  const inc = {}, exp = {}, per = {};
  for (let k = from; k <= to; k = mAdd(k,1)) per[k] = {inc:0, exp:0};
  D.ops.forEach(o => {
    if (o.type==='Перевод') return;
    const mk = o.date.slice(0,7), s = o.type==='Доход' ? 1 : -1;
    if (mk < from){ start += s*o.amount; return; }
    if (mk > to) return;
    const b = o.type==='Доход' ? inc : exp;
    b[o.group] = b[o.group] || {};
    b[o.group][o.article] = (b[o.group][o.article]||0) + o.amount;
    if (o.type==='Доход') per[mk].inc += o.amount; else per[mk].exp += o.amount;
  });
  const toList = b => Object.keys(b).map(g => ({ group:g, total: sum(Object.values(b[g])), items: Object.entries(b[g]).map(([a,v])=>({a,v})).sort((x,y)=>y.v-x.v) })).sort((x,y)=>y.total-x.total);
  const inL = toList(inc), exL = toList(exp);
  const tIn = sum(inL,g=>g.total), tEx = sum(exL,g=>g.total);
  let run = start;
  const months = Object.keys(per).map(k => { const p = per[k]; const st = run; run += p.inc - p.exp; return { k, start: st, inc:p.inc, exp:p.exp, net:p.inc-p.exp, end: run }; });
  return { start, inL, exL, tIn, tEx, net: tIn - tEx, end: start + tIn - tEx, months };
}

const TITLES = { home:'Обзор', ops:'Операции', pf:'План-факт', odds:'Движение денег' };

function render(){
  if (!D) return;
  const sub = S.tab==='odds' && S.odds!=='month' ? '<small>'+esc(periodLabel())+'</small>' : '';
  $('#mlabel').innerHTML = esc(mLabel(S.month)) + '<span class="sync" id="sync"></span>' + sub;

  $('#view').innerHTML = `<h1 class="lt">${TITLES[S.tab]}</h1>` +
    (S.tab==='home' ? viewHome() : S.tab==='ops' ? viewOps() : S.tab==='pf' ? viewPF() : viewOdds());
  setSync(S.busy);
}
function setSync(on){ const s = $('#sync'); if (s) s.classList.toggle('on', !!on); }
function periodLabel(){ const [a,b] = oddsRange(); return a===b ? mLabel(a) : mShort(a)+' — '+mShort(b); }

function barCls(fact, plan, type){
  if (!plan) return fact ? (type==='Доход' ? 'good' : 'over') : '';
  const r = fact/plan;
  if (type==='Доход') return r>=1 ? 'good' : '';
  return r>1 ? 'over' : r>=.85 ? 'warn' : '';
}
const barW = (f,p) => p ? Math.min(100, f/p*100) : (f ? 100 : 0);
const bar = (f,p,t,cls) => `<div class="bar ${cls||''}"><i class="${barCls(f,p,t)}" style="width:${barW(f,p)}%"></i></div>`;

function opRow(o){
  const tr = o.type==='Перевод';
  const title = tr ? 'Перевод' : o.article;
  const sub = tr ? (o.wallet+' → '+o.wallet2) : [o.group, o.wallet, o.cp].filter(Boolean).join(' · ');
  const cls = o.type==='Доход' ? 'pos' : tr ? 'l2' : '';
  const amt = o.type==='Доход' ? money(o.amount,true) : tr ? money(o.amount) : money(-o.amount);
  return `<button class="row tap" data-act="edit" data-v="${esc(o.id)}">
    <span class="tile">${esc(tr ? '⇄' : artIcon(o.group,o.article))}</span>
    <span class="main"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}${o.comment ? ' — '+esc(o.comment) : ''}</div></span>
    <span class="a ${cls}">${amt}</span></button>`;
}
const sortOps = a => a.slice().sort((x,y)=> y.date.localeCompare(x.date) || (y._t||0)-(x._t||0));

function viewOps(){
  let ops = opsOfMonth(S.month);
  const f = S.opsFilter;
  if (f!=='all') ops = ops.filter(o=>o.type===f);
  const seg = `<div class="seg">${[['all','Все'],['Расход','Расходы'],['Доход','Доходы'],['Перевод','Переводы']]
    .map(([v,l])=>`<button class="${f===v?'on':''}" data-act="opsf" data-v="${v}">${l}</button>`).join('')}</div>`;
  if (!ops.length) return seg + `<div class="list"><div class="empty"><div class="big">🗂️</div>Нет операций за ${esc(mLabel(S.month).toLowerCase())}</div></div>`;
  const byDay = {};
  sortOps(ops).forEach(o => (byDay[o.date] = byDay[o.date] || []).push(o));
  return seg + Object.keys(byDay).map(d => {
    const list = byDay[d];
    const dt = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
    const net = sum(list, o => o.type==='Доход' ? o.amount : o.type==='Расход' ? -o.amount : 0);
    const lbl = dLabel(d) + (d===today()||d===yesterday() ? '' : ', '+WD[dt.getDay()]);
    return `<div class="sec-h"><span>${lbl}</span><span class="v">${net ? money(net,true) : ''}</span></div><div class="list ic">${list.map(opRow).join('')}</div>`;
  }).join('');
}

function viewPF(){
  const t = S.pfType;
  const pf = planFact(S.month, t);
  const seg = `<div class="seg"><button class="${t==='Расход'?'on':''}" data-act="pft" data-v="Расход">Расходы</button><button class="${t==='Доход'?'on':''}" data-act="pft" data-v="Доход">Доходы</button></div>`;
  const diff = t==='Расход' ? pf.plan - pf.fact : pf.fact - pf.plan;
  const head = `<div class="list trio">
    <div><div class="k">План</div><div class="v">${money(pf.plan)}</div></div>
    <div><div class="k">Факт</div><div class="v">${money(pf.fact)}</div></div>
    <div><div class="k">${t==='Расход' ? (diff>=0?'Осталось':'Перерасход') : (diff>=0?'Сверх плана':'Недобор')}</div><div class="v ${diff<0?'red':'pos'}">${money(Math.abs(diff))}</div></div></div>`;
  if (!pf.groups.length) return seg + head + '<div class="list"><div class="empty">Статей нет — добавьте их на листе «Статьи».</div></div>';
  return seg + head + pf.groups.map(g => `
    <div class="sec-h"><span>${esc(g.group)}</span><span class="v">${money(g.fact)} из ${money(g.plan)}</span></div>
    <div class="list ic">${g.items.map(i => {
      const d = t==='Расход' ? i.plan - i.fact : i.fact - i.plan;
      const rest = !i.plan ? (i.fact ? (t==='Расход' ? '<span class="red">вне плана</span>' : 'вне плана') : 'план не задан')
        : t==='Расход' ? (d>=0 ? 'осталось '+money(d) : '<span class="red">перерасход '+money(-d)+'</span>')
        : (d>=0 ? '<span class="pos">план выполнен</span>' : 'ещё '+money(-d));
      return `<div class="row"><span class="tile">${esc(i.icon||'•')}</span>
        <span class="main"><div class="spl"><span class="t">${esc(i.name)}</span><span class="num">${money(i.fact)} <span class="l2 sm">/ ${nf.format(i.plan)}</span></span></div>
        <div style="margin:7px 0 5px">${bar(i.fact,i.plan,t)}</div><div class="s">${rest}</div></span></div>`; }).join('')}</div>`).join('');
}

function viewOdds(){
  const [from,to] = oddsRange();
  const r = odds(from,to);
  const seg = `<div class="seg">${[['month','Месяц'],['quarter','Квартал'],['year','Год'],['all','Всё время']]
    .map(([v,l])=>`<button class="${S.odds===v?'on':''}" data-act="odds" data-v="${v}">${l}</button>`).join('')}</div>`;
  const block = list => list.length ? list.map(g => `<details><summary class="row tap"><span class="tile">${esc(groupIcon(g.group))}</span><span class="main t">${esc(g.group)}</span><span class="a">${money(g.total)}</span>${DISC}</summary>
      <div class="sub">${g.items.map(i=>`<div class="row"><span class="main t">${esc(artIcon(g.group,i.a))}&nbsp; ${esc(i.a)}</span><span class="a l2">${money(i.v)}</span></div>`).join('')}</div></details>`).join('')
    : '<div class="row l2">Нет операций</div>';
  let html = seg + `
  <div class="list"><div class="row"><span class="main">Остаток на начало</span><span class="a"><b>${money(r.start)}</b></span></div></div>
  <div class="sec-h"><span>Поступления</span><span class="v pos">${money(r.tIn,true)}</span></div>
  <div class="list ic">${block(r.inL)}</div>
  <div class="sec-h"><span>Выбытия</span><span class="v">${money(-r.tEx)}</span></div>
  <div class="list ic">${block(r.exL)}</div>
  <div class="list">
    <div class="row"><span class="main">Чистый поток</span><span class="a ${r.net<0?'red':'pos'}">${money(r.net,true)}</span></div>
    <div class="row"><span class="main"><b>Остаток на конец</b></span><span class="a"><b>${money(r.end)}</b></span></div>
  </div>`;
  if (r.months.length > 1){
    html += `<div class="sec-h"><span>По месяцам</span></div><div class="list"><div class="tbl"><table>
      <tr><th></th>${r.months.map(m=>`<th>${esc(mShort(m.k))}</th>`).join('')}</tr>
      <tr><td>Начало</td>${r.months.map(m=>`<td>${nf.format(Math.round(m.start))}</td>`).join('')}</tr>
      <tr><td>Поступления</td>${r.months.map(m=>`<td class="pos">${nf.format(Math.round(m.inc))}</td>`).join('')}</tr>
      <tr><td>Выбытия</td>${r.months.map(m=>`<td>${nf.format(Math.round(m.exp))}</td>`).join('')}</tr>
      <tr><td>Поток</td>${r.months.map(m=>`<td class="${m.net<0?'red':''}">${nf.format(Math.round(m.net))}</td>`).join('')}</tr>
      <tr><td>Конец</td>${r.months.map(m=>`<td><b>${nf.format(Math.round(m.end))}</b></td>`).join('')}</tr>
    </table></div></div>`;
  }
  return html;
}
function groupIcon(g){ return /общ/i.test(g) ? '👪' : (g.trim()[0] || '•').toUpperCase(); }

/* ----------------------------- sheet ----------------------------- */
function openSheet(title, done, body){
  $('#shTitle').textContent = title;
  $('#shDone').textContent = done;
  $('#shBody').innerHTML = body;
  $('#shBody').scrollTop = 0;
  $('#sheet').style.transform = '';
  $('#sheet').classList.add('on');
  $('#scrim').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (tg && tg.BackButton) tg.BackButton.show();
}
function closeSheet(){
  F = null; mode = null;
  $('#sheet').classList.remove('on');
  $('#sheet').style.transform = '';
  $('#scrim').classList.remove('on');
  $('#scrim').style.opacity = '';
  document.body.style.overflow = '';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (tg && tg.BackButton) tg.BackButton.hide();
}
// свайп вниз за шапку модального окна: трекинг 1:1, закрытие по расстоянию или скорости
(function(){
  const sh = $('#sheet'); let y0=0, dy=0, t0=0, v=0, on=false;
  const start = e => { if (e.target.closest('button')) return; on=true; y0=e.clientY; dy=0; t0=performance.now(); v=0; sh.classList.add('drag'); e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if(!on) return; const now=performance.now(); const ny = e.clientY - y0; v = (ny-dy)/Math.max(1,now-t0); t0=now; dy=ny;
    const y = dy>0 ? dy : -Math.pow(-dy,.7); sh.style.transform = `translateY(${y}px)`; $('#scrim').style.opacity = String(Math.max(0,1-dy/ (sh.offsetHeight||600))); };
  const end = () => { if(!on) return; on=false; sh.classList.remove('drag'); $('#scrim').style.opacity='';
    if (dy > 140 || v > .6) closeSheet(); else sh.style.transform = ''; };
  ['#grab','#shNav'].forEach(s => { const el=$(s); el.addEventListener('pointerdown',start); el.addEventListener('pointermove',move); el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); });
})();

/* ------------------------- форма операции ------------------------- */
const last = (() => { try { return JSON.parse(LS.get('fb_last')||'{}'); } catch(e){ return {}; } })();
const saveLast = () => LS.set('fb_last', JSON.stringify(last));
const groupsFor = t => uniq(D.articles.filter(a=>a.type===t && a.active).map(a=>a.group));
function artsFor(t, g){
  const since = isoOf(new Date(Date.now()-90*864e5));
  const cnt = {};
  D.ops.forEach(o => { if (o.type===t && o.date>=since){ const k=akey(o.group,o.article); cnt[k]=(cnt[k]||0)+1; } });
  const list = D.articles.filter(a => a.type===t && a.group===g && (a.active || (F && F.id && F.article===a.name && F.group===g)));
  return list.map((a,i)=>({a,i})).sort((x,y)=> (cnt[akey(g,y.a.name)]||0)-(cnt[akey(g,x.a.name)]||0) || x.i-y.i).map(x=>x.a);
}
function defaultGroup(t){
  const gs = groupsFor(t);
  const nm = D.user && D.user.name || '';
  const pref = [last['g_'+t], D.user && D.user.group, gs.find(g => nm.indexOf(g)>=0), 'Общие'];
  return pref.find(g => g && gs.indexOf(g)>=0) || gs[0] || '';
}
function defaultWallet(){
  const ws = D.wallets.filter(w=>w.active).map(w=>w.name);
  const nm = D.user && D.user.name || '';
  const own = D.wallets.find(w => w.active && w.owner && nm.indexOf(w.owner)>=0);
  return [last.wallet, D.user && D.user.wallet, own && own.name].find(w => w && ws.indexOf(w)>=0) || ws[0] || '';
}

    <div class="list">
      <div class="field-row"><label for="fCp">Контрагент</label><input id="fCp" list="cpList" placeholder="Необязательно" autocomplete="off" value="${esc(F.cp||'')}"></div>
      <div class="field-row"><label for="fComment">Комментарий</label><input id="fComment" placeholder="Необязательно" autocomplete="off" value="${esc(F.comment||'')}"></div>
    </div>
    <datalist id="cpList">${(D.counterparties||[]).map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    ${op ? '<div class="list"><button class="row tap danger" data-act="delete">Удалить операцию</button></div>' : ''}`);
  updOp();
  if (!op) setTimeout(()=>{ const a=$('#fAmount'); if (a && mode==='op') a.focus(); }, 420);
}
function updOp(){
  const t = F.type, tr = t==='Перевод';
  document.querySelectorAll('#fType button').forEach(b=>b.classList.toggle('on', b.dataset.v===t));
  $('#fCatBlock').hidden = tr;
  $('#fWal2Block').hidden = !tr;
  $('#fWalLbl').textContent = tr ? 'Откуда' : t==='Доход' ? 'Зачислить на' : 'Кошелёк';
  if (!tr){
    const gs = groupsFor(t);
    if (F.group && gs.indexOf(F.group)<0 && !F.id) F.group = defaultGroup(t);
    const gl = F.group && gs.indexOf(F.group)<0 ? gs.concat(F.group) : gs;
    $('#fGroup').innerHTML = gl.map(g=>`<button class="${g===F.group?'on':''}" data-act="fgroup" data-v="${esc(g)}">${esc(g)}</button>`).join('');
    $('#fGroup').hidden = gl.length < 2;
    const arts = artsFor(t, F.group);
    if (F.article && !arts.find(a=>a.name===F.article)) F.article = '';
    $('#fArt').innerHTML = arts.map(a=>`<button class="cat ${a.name===F.article?'on':''}" data-act="fart" data-v="${esc(a.name)}"><span class="ct">${esc(a.icon||'•')}</span><span class="nm">${esc(a.name)}</span></button>`).join('')
      || '<div class="l2 sm" style="grid-column:1/-1;text-align:center">Нет статей в этой группе</div>';
  }
  const ws = D.wallets.filter(w=>w.active || w.name===F.wallet || w.name===F.wallet2);
  const pill = (w,act,on,dis) => `<button class="pill ${on?'on':''}" ${dis?'disabled':''} data-act="${act}" data-v="${esc(w.name)}">${esc(w.icon||'💳')} ${esc(w.name)}</button>`;
  $('#fWal').innerHTML = ws.map(w=>pill(w,'fwal',w.name===F.wallet)).join('');
  $('#fWal2').innerHTML = ws.map(w=>pill(w,'fwal2',w.name===F.wallet2,w.name===F.wallet)).join('');
  const td = today(), yd = yesterday(), other = F.date!==td && F.date!==yd;
  $('#fDates').innerHTML = `<button class="pill ${F.date===td?'on':''}" data-act="fdate" data-v="${td}">Сегодня</button>`+
    `<button class="pill ${F.date===yd?'on':''}" data-act="fdate" data-v="${yd}">Вчера</button>`+
    `<span class="pill ${other?'on':''}">📅 ${other ? esc(dLabel(F.date)+' '+F.date.slice(0,4)) : 'Другая дата'}<input type="date" id="fDate" value="${F.date}"></span>`;
  $('#fDate').addEventListener('change', e => { if (F && e.target.value){ F.date = e.target.value; updOp(); haptic(); } });
}
function parseAmount(s){
  s = String(s||'').replace(/\s/g,'').replace(/,/g,'.');
  if (!s || !/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return ('+s+')')(); return Math.round(v*100)/100; } catch(e){ return NaN; }
}
async function saveOp(){
  F.amount = $('#fAmount').value; F.cp = $('#fCp').value.trim(); F.comment = $('#fComment').value.trim();
  const amount = parseAmount(F.amount);
  if (!(amount > 0)) return fail('Введите сумму', '#fAmount');
  if (F.type==='Перевод'){ if (!F.wallet2 || F.wallet2===F.wallet) return fail('Выберите, куда перевести'); }
  else if (!F.article) return fail('Выберите статью');
  if (!F.wallet) return fail('Выберите кошелёк');
  const tr = F.type==='Перевод';
  const op = { id:F.id, type:F.type, amount, date:F.date, wallet:F.wallet, wallet2: tr?F.wallet2:'', group: tr?'':F.group, article: tr?'':F.article, cp:F.cp, comment:F.comment };
  await busy(async () => {
    const res = await api(F.id ? 'update' : 'add', { op });
    res._t = Date.now();
    const i = D.ops.findIndex(o=>o.id===res.id);
    if (i>=0) D.ops[i] = res; else D.ops.push(res);
    if (res.cp && D.counterparties.indexOf(res.cp)<0) D.counterparties.push(res.cp);
    last.wallet = op.wallet; if (op.group) last['g_'+op.type] = op.group; saveLast();
    const wasNew = !F.id;
    cache(); haptic('success'); closeSheet();
    S.month = res.date.slice(0,7); render();
    hud(wasNew ? 'Добавлено' : 'Сохранено');
  });
}
async function deleteOp(){
  if (!F || !F.id) return;
  const id = F.id;
  if (!(await ask('Удалить эту операцию?'))) return;
  await busy(async () => {
    await api('delete', { id });
    D.ops = D.ops.filter(o=>o.id!==id);
    cache(); haptic('success'); closeSheet(); render(); hud('Удалено');
  });
}

/* ------------------------- форма кошелька ------------------------- */
function openWallet(name){
  const w = name ? D.wallets.find(x=>x.name===name) : null;
  if (name && !w) return;
  mode = 'wallet';
  F = w ? { oldName:w.name, name:w.name, icon:w.icon||'💳', owner:w.owner||'', initial:w.initial||0, active:w.active }
        : { oldName:null, name:'', icon:'💳', owner:'', initial:0, active:true };
  const owners = uniq(D.articles.map(a=>a.group).concat(D.wallets.map(x=>x.owner)).filter(Boolean));
  const bal = w ? balances()[w.name] || 0 : null;
  const n = w ? D.ops.filter(o=>o.wallet===w.name||o.wallet2===w.name).length : 0;
  openSheet(w ? 'Кошелёк' : 'Новый кошелёк', 'Готово', `
    <div style="text-align:center;padding:6px 0 22px"><div class="tile" id="wIconBig" style="width:72px;height:72px;border-radius:18px;font-size:38px;margin:0 auto 10px;background:var(--card)">${esc(F.icon)}</div>
      ${w ? `<div class="l2 sm">Текущий остаток</div><div class="num" style="font-size:28px;font-weight:700;letter-spacing:-.02em">${money(bal)}</div>` : ''}</div>
    <div class="list">
      <div class="field-row"><label for="wName">Название</label><input id="wName" placeholder="Например, Сбер вклад" autocomplete="off" value="${esc(F.name)}"></div>
      <div class="field-row"><label for="wInit">Начальный остаток</label><input id="wInit" inputmode="decimal" placeholder="0" autocomplete="off" value="${F.initial ? esc(String(F.initial).replace('.',',')) : ''}"></div>
    </div>
    <div class="foot">Сумма на кошельке на дату начала учёта. Дальше остаток считается из операций.</div>
    <div class="sec-h">Иконка</div>
    <div class="list"><div class="emojis" id="wIcons"></div></div>
    <div class="sec-h">Владелец</div>
    <div class="pills" id="wOwner"></div>
    <div class="list"><div class="field-row"><label for="wActive" style="flex:1">Показывать при вводе</label><input type="checkbox" class="sw" id="wActive" ${F.active?'checked':''}></div></div>
    <div class="foot">${w ? (n ? `Операций по кошельку: ${n}. Удалить кошелёк с историей нельзя — его можно скрыть.` : 'Кошелёк без операций — его можно просто скрыть или удалить строку в таблице.') : 'Кошелёк появится в таблице на листе «Кошельки».'}</div>`);
  const upd = () => {
    $('#wIcons').innerHTML = uniq(WALLET_ICONS.concat(F.icon)).map(i=>`<button class="${i===F.icon?'on':''}" data-act="wicon" data-v="${esc(i)}">${esc(i)}</button>`).join('');
    $('#wOwner').innerHTML = [''].concat(owners).map(o=>`<button class="pill ${o===F.owner?'on':''}" data-act="wowner" data-v="${esc(o)}">${o ? esc(o) : 'Не указан'}</button>`).join('');
    $('#wIconBig').textContent = F.icon;
  };
  F._upd = upd; upd();
  if (!w) setTimeout(()=>{ const a=$('#wName'); if (a && mode==='wallet') a.focus(); }, 420);
}
async function saveWallet(){
  const name = $('#wName').value.trim();
  const initial = $('#wInit').value.trim() ? parseAmount($('#wInit').value) : 0;
  if (!name) return fail('Введите название', '#wName');
  if (isNaN(initial)) return fail('Проверьте начальный остаток', '#wInit');
  if (D.wallets.some(w => w.name.toLowerCase()===name.toLowerCase() && w.name!==F.oldName)) return fail('Такой кошелёк уже есть', '#wName');
  const wallet = { name, initial, icon:F.icon, owner:F.owner, active: $('#wActive').checked };
  const isNew = !F.oldName;
  await busy(async () => {
    const data = await api('saveWallet', { wallet, oldName: F.oldName });
    D = data; cache(); haptic('success'); closeSheet(); render();
    hud(isNew ? 'Кошелёк создан' : 'Сохранено');
  });
}

/* --------------------------- общие --------------------------- */
async function busy(fn){
  if (S.saving) return;
  S.saving = true; const b = $('#shDone'); b.disabled = true; const txt = b.textContent; b.textContent = '···';
  try { await fn(); }
  catch(e){ haptic('error'); hud(e.message || 'Не удалось сохранить'); }
  finally { S.saving = false; b.disabled = false; b.textContent = txt; }
}
function fail(msg, focus){ haptic('error'); hud(msg); if (focus) { const el=$(focus); if (el) el.focus(); } }
function ask(msg){
  return new Promise(res => {
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.showConfirm(msg, ok => res(!!ok));
    else res(window.confirm(msg));
  });
}
function haptic(kind){
  try{
    if (!tg || !tg.HapticFeedback) return;
    if (kind) tg.HapticFeedback.notificationOccurred(kind); else tg.HapticFeedback.selectionChanged();
  }catch(e){}
}
let hudT;
function hud(msg){ const t=$('#hud'); t.textContent = msg; t.classList.add('on'); clearTimeout(hudT); hudT = setTimeout(()=>t.classList.remove('on'), 2000); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch(a){
    case 'tab': if (S.tab!==v){ S.tab = v; render(); window.scrollTo(0,0); haptic(); } break;
    case 'month': S.month = mAdd(S.month, +v); render(); haptic(); break;
    case 'opsf': S.opsFilter = v; render(); haptic(); break;
    case 'pft': S.pfType = v; render(); haptic(); break;
    case 'odds': S.odds = v; render(); haptic(); break;
    case 'new': haptic(); openOp(null); break;
    case 'edit': { const o = D.ops.find(x=>x.id===v); if (o) openOp(o); break; }
    case 'wallet': openWallet(v); break;
    case 'wallet-new': openWallet(null); break;
    case 'close': closeSheet(); break;
    case 'done': if (mode==='op') saveOp(); else if (mode==='wallet') saveWallet(); break;
    case 'delete': deleteOp(); break;
    case 'ftype': F.type = v; if (v!=='Перевод' && !F.id) F.group = defaultGroup(v); F.article=''; updOp(); haptic(); break;
    case 'fgroup': F.group = v; F.article = ''; updOp(); haptic(); break;
    case 'fart': F.article = v; updOp(); haptic(); break;
    case 'fwal': F.wallet = v; if (F.wallet2===v) F.wallet2=''; updOp(); haptic(); break;
    case 'fwal2': F.wallet2 = v; updOp(); haptic(); break;
    case 'fdate': F.date = v; updOp(); haptic(); break;
    case 'wicon': F.icon = v; F._upd(); haptic(); break;
    case 'wowner': F.owner = v; F._upd(); haptic(); break;
    case 'retry': start(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.matches('.sheet input')) e.target.blur(); });
window.addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', window.scrollY > 4), { passive:true });

/* ---------------------------- запуск ---------------------------- */
function cache(){ if (!DEMO && D) LS.set('fb_data', JSON.stringify(D)); }
function screen(icon, title, text, btn){
  $('#nav').hidden = true; $('#tabs').hidden = true;
  $('#view').innerHTML = `<div class="screen"><div class="big">${icon}</div><h2>${title}</h2><p>${text}</p>${btn||''}</div>`;
}
function skeleton(){
  $('#view').innerHTML = '<h1 class="lt">Обзор</h1><div class="skel" style="height:90px;background:transparent"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:176px"></div><div class="skel" style="height:220px"></div>';
}
async function start(){
  $('#nav').hidden = false; $('#tabs').hidden = false;
  if (DEMO) $('#demoBar').hidden = false;
  else if (!inTg) return screen('📱','Откройте в Telegram','Это мини-приложение семейного бюджета. Откройте его кнопкой «Бюджет» в вашем боте.','<a class="btn" href="?demo=1">Посмотреть демо</a>');
  else if (!API) return screen('🔌','Приложение не подключено','В Google Таблице выберите меню «💰 Бюджет» → «3. Подключить приложение к боту» и откройте приложение заново.');
  if (!D && !DEMO){ try { D = JSON.parse(LS.get('fb_data')||'null'); } catch(e){ D = null; } }
  if (D) render(); else skeleton();
  S.busy = true; setSync(true);
  try{
    D = await api('load', {});
    cache(); render();
  }catch(e){
    if (e.code==='forbidden') return screen('🔐','Нужен доступ',
      `Ваш Telegram ID: <code>${esc(e.tgId)}</code><br><br>Откройте Google Таблицу → лист «Доступ» и включите «Разрешён» в вашей строке.`,
      '<button class="btn" data-act="retry">Обновить</button>');
    if (!D) return screen('⚠️','Не удалось загрузить', esc(e.message||'Ошибка сети'), '<button class="btn" data-act="retry">Повторить</button>');
    hud('Нет связи — показаны сохранённые данные');
  }finally{ S.busy = false; setSync(false); }
}

if (tg){
  try{
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.BackButton.onClick(closeSheet);
    tg.onEvent('themeChanged', applyTheme);
  }catch(e){}
}

/* ------------------------------ ДЕМО ------------------------------ */
let DEMO_DB = null;
function demoApi(action, p){
  return new Promise(res => setTimeout(() => {
    if (!DEMO_DB) DEMO_DB = demoData();
    if (action==='load') res(JSON.parse(JSON.stringify(DEMO_DB)));
    else if (action==='delete') res({ id:p.id });
    else if (action==='saveWallet'){
      const db = JSON.parse(JSON.stringify(D)); const w = p.wallet;
      if (p.oldName){
        const x = db.wallets.find(z=>z.name===p.oldName); Object.assign(x, w);
        if (p.oldName!==w.name) db.ops.forEach(o=>{ if(o.wallet===p.oldName) o.wallet=w.name; if(o.wallet2===p.oldName) o.wallet2=w.name; });
      } else db.wallets.push(w);
      DEMO_DB = db; res(JSON.parse(JSON.stringify(db)));
    }
    else res({ ...p.op, id: p.op.id || Math.random().toString(36).slice(2,12), author:'Демо' });
  }, 300));
}
function demoData(){
  const A = [['Люся','Зарплата','Доход','💼',150000],['Кирилл','Зарплата','Доход','💼',190000],['Общие','Прочие доходы','Доход','💰',0],
    ['Люся','Ногти','Расход','💅',5000],['Люся','Брови','Расход','✨',1000],['Люся','Волосы','Расход','💇‍♀️',3500],['Люся','Обеды','Расход','🍱',10000],
    ['Люся','Косметика','Расход','💄',2000],['Люся','Бобик','Расход','🐶',5500],['Люся','Прокладки','Расход','🌸',1000],['Люся','Косметолог','Расход','🧖‍♀️',7000],
    ['Люся','Пилатес','Расход','🧘‍♀️',4000],['Люся','Связь','Расход','📱',700],['Люся','Витамины','Расход','💊',5000],['Люся','Одежда','Расход','👗',5000],
    ['Кирилл','Связь','Расход','📱',400],['Кирилл','Интернет','Расход','🌐',1600],['Кирилл','Одежда','Расход','👕',5000],['Кирилл','ИИ Подписки','Расход','🤖',4000],
    ['Общие','Коммуналка','Расход','🏠',5000],['Общие','Еда','Расход','🛒',50000],['Общие','Развлечения','Расход','🎉',5000],['Общие','Кафе','Расход','☕',10000],['Общие','Подарки','Расход','🎁',10000]];
  const articles = A.map(a=>({group:a[0],name:a[1],type:a[2],icon:a[3],active:true}));
  const wallets = [{name:'Карта Кирилла',owner:'Кирилл',initial:85000,icon:'💳',active:true},{name:'Карта Люси',owner:'Люся',initial:42000,icon:'💳',active:true},{name:'Наличные',owner:'Общие',initial:7000,icon:'💵',active:true}];
  const cur = today().slice(0,7), prev = mAdd(cur,-1);
  const budget = {};
  [mAdd(cur,-2),prev,cur,mAdd(cur,1)].forEach(m => { budget[m] = {}; A.forEach(a=>{ if (a[4]) budget[m][akey(a[0],a[1])] = a[4]; }); });
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const ops = []; let n = 0;
  const add = (date,type,g,a,amount,wallet,cp,wallet2) => ops.push({id:'d'+(n++),date,type,group:g||'',article:a||'',amount:Math.round(amount),wallet,wallet2:wallet2||'',cp:cp||'',comment:'',author:'Демо'});
  const td = new Date();
  [prev,cur].forEach(m => {
    const days = m===cur ? td.getDate() : new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
    const d = k => m+'-'+pad(Math.min(k,days));
    add(d(5),'Доход','Кирилл','Зарплата',190000,'Карта Кирилла','Работа');
    add(d(10),'Доход','Люся','Зарплата',150000,'Карта Люси','Работа');
    add(d(3),'Перевод','','',10000,'Карта Кирилла','','Наличные');
    add(d(12),'Расход','Общие','Коммуналка',5400,'Карта Кирилла','Мосэнергосбыт');
    add(d(2),'Расход','Кирилл','ИИ Подписки',3900,'Карта Кирилла','Anthropic');
    add(d(4),'Расход','Кирилл','Интернет',1600,'Карта Кирилла','Ростелеком');
    add(d(6),'Расход','Люся','Ногти',2500,'Карта Люси');
    add(d(9),'Расход','Люся','Пилатес',4000,'Карта Люси','Студия');
    add(d(8),'Расход','Люся','Бобик',3200,'Карта Люси','Зоомагазин');
    for (let k=1; k<=days; k+=2) add(d(k),'Расход','Общие','Еда',1200+rnd()*2600,rnd()>.5?'Карта Кирилла':'Карта Люси', rnd()>.5?'Пятёрочка':'ВкусВилл');
    for (let k=2; k<=days; k+=5) add(d(k),'Расход','Общие','Кафе',600+rnd()*1800,'Карта Кирилла','Кофейня');
    for (let k=1; k<=days; k+=3) add(d(k),'Расход','Люся','Обеды',350+rnd()*500,'Карта Люси');
    if (days>14) add(d(15),'Расход','Общие','Развлечения',3800,'Наличные','Кино');
  });
  return { user:{id:1,name:'Кирилл',group:'',wallet:''}, articles, wallets, counterparties:['Пятёрочка','ВкусВилл','Кофейня','Ростелеком','Мосэнергосбыт'], budget, ops };
}

start();
