<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== MONO / PIXEL TERMINAL THEME ===== */
:root{
  --bg:#EDEDEB; --card:#FAFAF8; --sheet:#EDEDEB; --sheet-card:#FAFAF8;
  --ink:#0A0A0A; --label:#0A0A0A; --label2:#6B6B6B; --label3:#A3A3A3; --label4:#C9C9C6;
  --line:#0A0A0A; --dash:#B5B5B2;
  --pix:"Press Start 2P",ui-monospace,monospace;
  --font:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --shadow:4px 4px 0 var(--ink);
}
[data-theme=dark]{
  --bg:#0C0C0C; --card:#141414; --sheet:#0C0C0C; --sheet-card:#141414;
  --ink:#EDEDEB; --label:#EDEDEB; --label2:#8E8E8E; --label3:#5C5C5C; --label4:#333;
  --line:#EDEDEB; --dash:#3A3A3A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:15px/1.45 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;letter-spacing:inherit;text-align:inherit}
input{font:inherit;color:var(--label);letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}
.l2{color:var(--label2)} .l3{color:var(--label3)}
.pos,.blue,.orange{color:var(--label)}
.red{background:var(--ink);color:var(--bg)!important;padding:0 4px}
.fn{font-size:12px;line-height:17px}
.sub{font-size:14px}
::selection{background:var(--ink);color:var(--bg)}

/* nav */
.nav{position:sticky;top:0;z-index:10;height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);padding-left:6px;padding-right:6px}
.nav.scrolled{box-shadow:0 1.5px 0 var(--line)}
.chev{width:44px;height:44px;display:grid;place-items:center;color:var(--label)}
.chev svg{width:9px;height:15px}
.chev:active{background:var(--ink);color:var(--bg)}
.mlabel{text-align:center;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.12em}
.mlabel small{display:block;font-size:10px;color:var(--label2);letter-spacing:.06em;margin-top:1px}

main{max-width:640px;margin:0 auto;padding:0 16px 30px}
.lt{font:20px/1.5 var(--pix);text-transform:uppercase;letter-spacing:0;margin:6px 0 18px}

/* structure */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 10px}
.sec h2{margin:0;font:11px/1.6 var(--pix);text-transform:uppercase;letter-spacing:.02em}
.sec .v{font-size:12px;color:var(--label2)}
.link{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--label);display:inline-flex;align-items:center;gap:6px}
.link::after{content:"›";font-size:15px;line-height:1}
.link:active{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1.5px solid var(--line);overflow:hidden}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;position:relative;width:100%}
.card>.row+.row::before,.card>.row+details::before,.card>details+.row::before,.card>details+details::before{content:"";position:absolute;top:0;right:14px;left:var(--inset,14px);height:1px;background:repeating-linear-gradient(90deg,var(--dash) 0 4px,transparent 4px 7px)}
.card>details{position:relative}
.card.ic{--inset:56px}
.tap:active{background:var(--ink);color:var(--bg)}
.tap:active .l2,.tap:active .s{color:var(--bg)}
.row .m{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .s{font-size:12px;line-height:17px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.ico{width:30px;height:30px;display:grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto;filter:grayscale(1) contrast(1.15);border:1px solid var(--dash)}
[data-theme=dark] .ico{filter:grayscale(1) brightness(1.1)}
.disc{width:6px;height:11px;color:var(--label2);flex:0 0 auto}
.check{width:14px;height:12px;color:var(--label);flex:0 0 auto}

/* hero */
.hero{border:1.5px solid var(--line);background:var(--card);margin-bottom:6px;position:relative;overflow:hidden}
.art{position:relative;height:178px;border-bottom:1.5px solid var(--line);
  background:repeating-linear-gradient(0deg,var(--label4) 0 1px,transparent 1px 6px)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--card) 0%,var(--card) 30%,transparent 75%)}
.art .stripes{position:absolute;right:0;top:14px;width:58%;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:1}
.art .stripes i{display:block;height:1.5px;background:var(--label3)}
.pig{position:absolute;right:10px;bottom:6px;width:196px;color:var(--ink);z-index:2}
.pig svg{display:block;width:100%;height:auto;overflow:visible}
.coin{animation:drop 3.2s steps(8) infinite}
@keyframes drop{0%,35%{transform:translateY(-6px);opacity:0}45%{opacity:1}75%{transform:translateY(3px);opacity:1}76%,100%{transform:translateY(3px);opacity:0}}
.bubble{position:absolute;left:12px;top:12px;z-index:3;max-width:52%;background:var(--card);border:1.5px solid var(--line);box-shadow:3px 3px 0 var(--ink);padding:8px 10px;font-size:12px;line-height:17px}
.bubble::after{content:"";position:absolute;left:18px;bottom:-9px;width:8px;height:8px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:skewY(-45deg)}
.cur{display:inline-block;width:.6em;height:1.05em;background:var(--ink);vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-txt{padding:16px 14px 14px}
.hero .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--label2)}
.hero .big{font:26px/1.35 var(--pix);letter-spacing:-.02em;margin:10px 0 12px;word-break:break-word}
.stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--label)}
.stats span+span::before{content:"";display:inline-block;width:4px;height:4px;background:var(--ink);margin-right:10px;vertical-align:2px}

.cols{display:grid;grid-template-columns:repeat(3,1fr);margin-top:0}
.cols>div+div{padding-left:10px;border-left:1px dashed var(--dash)}
.cols .k{font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
.cols .v{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* block bars */
.bar{height:10px;border:1.5px solid var(--line);padding:1.5px;display:flex;background:var(--card)}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 7px);transition:width .5s var(--ease)}
.bar>i.over{background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 4px)}
.bar>i.add{background:repeating-linear-gradient(90deg,var(--label3) 0 5px,transparent 5px 7px)}
.bar>i.add.over{background:repeating-linear-gradient(-45deg,var(--label2) 0 2px,transparent 2px 4px)}
.bar.lg{height:16px;padding:2px}
.spl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.grp>.num{text-align:right}
.grp{display:grid;grid-template-columns:64px 1fr 112px;align-items:center;gap:10px;padding:10px 0 0;font-size:13px}
.grp .bar{height:8px;padding:1px;border-width:1px}
.grp .num{color:var(--label2);font-size:12px}
.empty{color:var(--label2);text-align:center;padding:34px 16px;font-size:13px}

/* segmented */
.seg{display:flex;border:1.5px solid var(--line);margin-bottom:6px;background:var(--card)}
.seg button{flex:1;height:34px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;text-align:center;white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* PF / ODDS */
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details .disc{transition:transform .2s steps(2)}
details[open] .disc{transform:rotate(90deg)}
.subrows .row{padding-left:56px;font-size:13px;min-height:38px;padding-top:7px;padding-bottom:7px}
.subrows .row::before{content:"";position:absolute;top:0;right:14px;left:56px;height:1px;background:repeating-linear-gradient(90deg,var(--dash) 0 4px,transparent 4px 7px)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:12px;min-width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;text-align:right;white-space:nowrap}
.tbl tr+tr td{border-top:1px dashed var(--dash)}
.tbl th{color:var(--label2);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.05em;border-bottom:1.5px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);color:var(--label2)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--bg);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--label2)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--bg);background:var(--ink)}
.tab.plus{color:var(--label)}
.tab.plus svg{width:34px;height:34px}
.tab.plus:active svg{transform:translate(2px,2px)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 1px,rgba(0,0,0,.28) 1px 3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top));z-index:31;background:var(--sheet);border-top:2px solid var(--line);max-width:640px;margin:0 auto;
  transform:translateY(100%);transition:transform .45s var(--ease);visibility:hidden;display:flex;flex-direction:column;overflow:hidden;--card:var(--sheet-card)}
@media (min-width:641px){.sheet{border:2px solid var(--line);border-bottom:0}}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.grab{width:40px;height:4px;background:var(--ink);margin:7px auto 0;flex:0 0 auto}
.pages{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sheet);transition:transform .4s var(--ease)}
#pSub{transform:translateX(100%);border-left:1.5px solid var(--line)}
.pages.push #pMain{transform:translateX(-28%)}
.pages.push #pSub{transform:none}
.sh-nav{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 12px;flex:0 0 auto;touch-action:none;border-bottom:1.5px solid var(--line)}
.sh-nav .ttl{font:10px/1.6 var(--pix);text-transform:uppercase;position:absolute;left:100px;right:100px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.txtbtn{height:32px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--label)}
.txtbtn:active{background:var(--ink);color:var(--bg)}
.txtbtn.b{background:var(--ink);color:var(--bg);padding:0 12px;box-shadow:3px 3px 0 var(--label3)}
.txtbtn.b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--label3)}
.txtbtn.b:disabled{background:transparent;color:var(--label3);box-shadow:none;outline:1.5px dashed var(--label3);outline-offset:-1.5px;cursor:default}
.txtbtn svg{width:9px;height:15px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px calc(34px + env(safe-area-inset-bottom))}
.sh-body .sec{margin-top:24px}
.gh{font:9px/1.6 var(--pix);text-transform:uppercase;margin:26px 0 8px;color:var(--label)}
.gf{font-size:12px;line-height:17px;color:var(--label2);margin:8px 2px 0}

/* entry form */
.amount{text-align:center;padding:26px 0 6px}
.amount .in{display:flex;align-items:baseline;justify-content:center;gap:6px;position:relative}
.amount .meas{position:absolute;visibility:hidden;white-space:pre;font:34px/1.4 var(--pix);letter-spacing:-.02em}
.amount input{border:0;outline:0;background:transparent;font:34px/1.4 var(--pix);letter-spacing:-.02em;text-align:center;width:40px;max-width:calc(100% - 40px);min-width:0;caret-color:var(--ink);padding:0}
.amount input::placeholder{color:var(--label4)}
.amount .cur{font-size:26px;font-weight:500;color:var(--label3);animation:none;background:none;width:auto;height:auto;margin:0}
.amount .hint{font-size:12px;color:var(--label2);min-height:18px;margin-top:8px}
.amount .hint::before{content:"> "}
.quick{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 10px;border:1.5px solid var(--line);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip,.fr .val,.subrows .t,.screen .big{filter:grayscale(1)}
.chip:active{transform:translate(1px,1px)}
.fr{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;position:relative;width:100%}
.fr+.fr::before,.info+.fr::before{content:"";position:absolute;top:0;right:14px;left:14px;height:1px;background:repeating-linear-gradient(90deg,var(--dash) 0 4px,transparent 4px 7px)}
.fr .k{flex:0 0 auto;font-weight:500}
.lead{flex:1;min-width:12px;height:1px;align-self:center;margin-top:8px;background:radial-gradient(circle,var(--label3) 1px,transparent 1.2px) 0 0/6px 2px repeat-x}
.fr .val{flex:0 1 auto;min-width:0;max-width:68%;text-align:right;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .val.set{color:var(--label)}
.fr .val.ph{color:var(--label);text-decoration:underline;text-underline-offset:3px}
.fr input.txt{flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;padding:12px 0}
.fr input.txt::placeholder{color:var(--label3)}
.fr .date{position:relative}
.fr input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.datepill{border:1.5px solid var(--line);padding:3px 8px;font-size:13px;font-weight:500}
.info{position:relative;padding:0 14px 12px 14px}
.info .spl{font-size:12px;line-height:17px;color:var(--label2);margin-bottom:6px}
.info .res{font-size:12px;line-height:17px;margin-top:6px}
.info .bar{height:10px}
.danger{justify-content:center;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}
.sw{position:relative;width:48px;height:26px;flex:0 0 48px;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:var(--card);cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;background:var(--label3);transition:transform .2s steps(3)}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(22px);background:var(--bg)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px}
.emojis button{height:44px;font-size:22px;display:grid;place-items:center;text-align:center;filter:grayscale(1);border:1.5px solid transparent}
.emojis button.on{border-color:var(--line);background:var(--bg)}

/* misc */
.hud{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:50;transform:translate(-50%,-200%);background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--label3);
  padding:10px 16px;font-size:13px;font-weight:500;max-width:88vw;text-align:center;transition:transform .35s var(--ease)}
.hud::before{content:"> "}
.hud.on{transform:translate(-50%,0)}
.screen{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.screen .big{font-size:48px;filter:grayscale(1)}
.screen h2{font:15px/1.6 var(--pix);text-transform:uppercase;margin:16px 0 10px}
.screen p{color:var(--label2);max-width:320px;font-size:13px;margin:0}
.btn{background:var(--ink);color:var(--bg);height:46px;padding:0 22px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-top:22px;display:inline-flex;align-items:center;text-decoration:none;box-shadow:4px 4px 0 var(--label3)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--label3)}
code{border:1.5px solid var(--line);padding:2px 8px;font:600 16px var(--font);user-select:all}
.skel{border:1.5px dashed var(--dash);margin-bottom:16px;animation:sk 1s steps(2) infinite}
@keyframes sk{50%{opacity:.4}}
.sync{width:7px;height:7px;background:var(--ink);display:inline-block;margin-left:8px;vertical-align:1px;opacity:0}
.sync.on{opacity:1;animation:blink .8s steps(1) infinite}
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:11px;padding:4px;text-transform:uppercase;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Демо — данные ненастоящие и не сохраняются</div>
<header class="nav" id="nav">
  <button class="chev" data-act="month" data-v="-1" aria-label="Предыдущий месяц"><svg viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 1.5 9.5l8 8"/></svg></button>
  <div class="mlabel" id="mlabel">…</div>
  <button class="chev" data-act="month" data-v="1" aria-label="Следующий месяц"><svg viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 8 8-8 8"/></svg></button>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="8.5" height="8.5" rx="2.4"/><rect x="15.5" y="4" width="8.5" height="8.5" rx="2.4"/><rect x="4" y="15.5" width="8.5" height="8.5" rx="2.4"/><rect x="15.5" y="15.5" width="8.5" height="8.5" rx="2.4"/></svg>Обзор</button>
  <button class="tab" data-act="tab" data-v="ops"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 7.5h14M10 14h14M10 20.5h14"/><circle cx="5.2" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="5.2" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="5.2" cy="20.5" r="1.3" fill="currentColor" stroke="none"/></svg>Операции</button>
  <button class="tab plus" data-act="new" aria-label="Новая операция"><svg viewBox="0 0 34 34" shape-rendering="crispEdges"><rect x="4" y="4" width="30" height="30" fill="var(--label3)"/><rect x="1" y="1" width="30" height="30" fill="var(--ink)"/><path d="M16 9v14M9 16h14" stroke="var(--bg)" stroke-width="2.6"/></svg></button>
  <button class="tab" data-act="tab" data-v="pf"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 23V14M11.5 23V5M18 23v-6M24.5 23V10"/></svg>План-факт</button>
  <button class="tab" data-act="tab" data-v="odds"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 23V5M9 5 4.5 9.5M9 5l4.5 4.5M19 5v18M19 23l-4.5-4.5M19 23l4.5-4.5"/></svg>ОДДС</button>
</nav>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"></div>
  <div class="pages" id="pages">
    <div class="page" id="pMain">
      <div class="sh-nav" id="shNav">
        <button class="txtbtn" data-act="close">Отменить</button>
        <div class="ttl" id="shTitle"></div>
        <button class="txtbtn b" id="shDone" data-act="done">Готово</button>
      </div>
      <div class="sh-body" id="shBody"></div>
    </div>
    <div class="page" id="pSub">
      <div class="sh-nav">
        <button class="txtbtn" data-act="back"><svg viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 1.5 9.5l8 8"/></svg>Назад</button>
        <div class="ttl" id="subTitle"></div>
        <span style="width:72px"></span>
      </div>
      <div class="sh-body" id="subBody"></div>
    </div>
  </div>
</section>
<div class="hud" id="hud"></div>

<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const qs = new URLSearchParams(location.search);
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let API = qs.get('api');
if (API) LS.set('fb_api', API); else API = LS.get('fb_api');
const DEMO = qs.has('demo');

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SH = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_PREP = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => isoOf(new Date());
const yesterday = () => isoOf(new Date(Date.now()-864e5));
const mAdd = (key,k) => { const d = new Date(+key.slice(0,4), +key.slice(5,7)-1+k, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const mLabel = key => MONTHS[+key.slice(5,7)-1]+' '+key.slice(0,4);
const mShort = key => MONTHS_SH[+key.slice(5,7)-1]+' '+key.slice(2,4);
const dLabel = iso => iso===today() ? 'Сегодня' : iso===yesterday() ? 'Вчера' : (+iso.slice(8,10))+' '+MONTHS_GEN[+iso.slice(5,7)-1] + (iso.slice(0,4)!==today().slice(0,4) ? ' '+iso.slice(0,4) : '');
const nf = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money = (n, sign) => { const v = Math.round(n*100)/100; return (sign && v>0 ? '+' : v<0 ? '−' : '') + nf.format(Math.abs(v)) + ' ₽'; };
const sum = (a,f) => a.reduce((s,x)=>s+(f?f(x):x),0);
const uniq = a => a.filter((x,i)=>a.indexOf(x)===i);
const akey = (g,a) => g+'|'+a;
const DISC = '<svg class="disc" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 5 5-5 5"/></svg>';
const CHECK = '<svg class="check" viewBox="0 0 15 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7 5.5 11 13.5 1.5"/></svg>';
const WALLET_ICONS = ['💳','🏦','💵','💰','🪙','🐷','📈','💎','🏠','🚗','✈️','🎁'];
// пиксельная копилка из горизонтальных «сканлайнов»: # — тело, o — сплошной пиксель (глаз, пятачок)
const PIG_SVG = (() => {
  const W = 34, H = 21;
  const tail = [[3,9],[2,8],[1,7],[1,6],[2,5],[3,5],[3,6]];
  const solid = [[25,7],[29,10],[31,10]];                        // глаз и ноздри
  const has = (a,x,y) => a.some(p=>p[0]===x&&p[1]===y);
  const ear = (x,y,tip) => y>=1 && y<=5 && Math.abs(x-tip) <= (y-1)*.6+.2;
  const inside = (x,y) => {
    if (y===4 && x>=12 && x<=15) return false;                   // прорезь для монет
    if (((x-14)/11)**2 + ((y-10.5)/6.3)**2 <= 1) return true;    // тело
    if (((x-24)/6)**2 + ((y-9)/5.6)**2 <= 1) return true;        // голова
    if (x>=28 && x<=31 && y>=8 && y<=12) return true;            // пятачок
    if (ear(x,y,22) || ear(x,y,26.5)) return true;               // уши
    if (y>=15 && y<=19 && [6,7,8,10,11,12,18,19,20,22,23,24].includes(x)) return true; // ноги
    return has(tail,x,y);
  };
  let r = '';
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    if (has(solid,x,y)) { r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; continue; }
    if (!inside(x,y)) continue;
    const h = y>=14 ? .78 : y>=9 ? .58 : .42;                   // ниже — плотнее: объём и тень
    r += `<rect x="${x}" y="${(y+(1-h)/2).toFixed(2)}" width="1.03" height="${h}"/>`;
  }
  const ground = [[3,W],[6,W-3],[1,W+1]].map(([x0,x1],i)=>`<rect x="${x0}" y="${H+.3+i*.6}" width="${x1-x0}" height=".25" opacity="${1-i*.35}"/>`).join('');
  return `<svg viewBox="0 -3 ${W+1} ${H+5}" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
    <g class="coin"><rect x="12.7" y="-2.6" width="2.2" height="2.2"/></g>${r}${ground}</svg>`;
})();
const TYPE_TITLE ={ 'Расход':'расход', 'Доход':'доход', 'Перевод':'перевод' };

let D = null;
const S = { tab:'home', month: today().slice(0,7), opsFilter:'all', pfType:'Расход', odds:'month', busy:false, saving:false };
let F = null, mode = null;

/* тема */
function applyTheme(){
  const dark = inTg && tg.colorScheme ? tg.colorScheme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try{
    if (inTg && tg.isVersionAtLeast('6.9')){ const bg = dark ? '#0C0C0C' : '#EDEDEB'; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
    if (inTg && tg.isVersionAtLeast('7.10') && tg.setBottomBarColor) tg.setBottomBarColor(dark ? '#0C0C0C' : '#EDEDEB');
  }catch(e){}
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* API */
async function api(action, payload){
  if (DEMO) return demoApi(action, payload);
  const r = await fetch(API, { method:'POST', body: JSON.stringify({ action, payload, initData: tg ? tg.initData : '' }) });
  const j = await r.json();
  if (!j.ok){ const e = new Error(j.error || 'Ошибка сервера'); e.code = j.code; e.tgId = j.id; throw e; }
  return j.data;
}

/* расчёты */
const artOf = (g,a) => D.articles.find(z=>z.group===g&&z.name===a);
const artIcon = (g,a) => { const x = artOf(g,a); return (x&&x.icon) || '•'; };
const walOf = n => D.wallets.find(w=>w.name===n);
function balances(excludeId){
  const m = {};
  D.wallets.forEach(w => m[w.name] = w.initial || 0);
  D.ops.forEach(o => {
    if (o.id===excludeId) return;
    if (o.type==='Доход') m[o.wallet] = (m[o.wallet]||0) + o.amount;
    else if (o.type==='Расход') m[o.wallet] = (m[o.wallet]||0) - o.amount;
    else { m[o.wallet] = (m[o.wallet]||0) - o.amount; m[o.wallet2] = (m[o.wallet2]||0) + o.amount; }
  });
  return m;
}
const opsOfMonth = key => D.ops.filter(o => o.date.slice(0,7)===key);
const planOf = (m,g,a) => (D.budget[m]||{})[akey(g,a)] || 0;
const factOf = (m,g,a,t,excludeId) => sum(D.ops.filter(o=>o.id!==excludeId && o.type===t && o.group===g && o.article===a && o.date.slice(0,7)===m), o=>o.amount);

function planFact(key, type){
  const ops = opsOfMonth(key).filter(o=>o.type===type);
  const plan = D.budget[key] || {};
  const fact = {};
  ops.forEach(o => { const k = akey(o.group,o.article); fact[k] = (fact[k]||0) + o.amount; });
  const arts = D.articles.filter(a => a.type===type && (a.active || plan[akey(a.group,a.name)] || fact[akey(a.group,a.name)]));
  const groups = uniq(arts.map(a=>a.group)).map(g => {
    const items = arts.filter(a=>a.group===g).map(a => ({ ...a, plan: plan[akey(g,a.name)]||0, fact: fact[akey(g,a.name)]||0 }))
      .sort((x,y)=> (y.fact - x.fact) || (y.plan - x.plan));
    return { group:g, items, plan: sum(items,i=>i.plan), fact: sum(items,i=>i.fact) };
  });
  return { groups, plan: sum(groups,g=>g.plan), fact: sum(groups,g=>g.fact) };
}
function oddsRange(){
  const m = S.month;
  if (S.odds==='month') return [m,m];
  if (S.odds==='quarter'){ const y=m.slice(0,4), q=Math.floor((+m.slice(5,7)-1)/3); return [y+'-'+pad(q*3+1), y+'-'+pad(q*3+3)]; }
  if (S.odds==='year') return [m.slice(0,4)+'-01', m.slice(0,4)+'-12'];
  return [D.ops.reduce((mn,o)=> o.date.slice(0,7)<mn ? o.date.slice(0,7) : mn, m), m];
}
function odds(from, to){
  let start = sum(D.wallets, w=>w.initial||0);
  const inc = {}, exp = {}, per = {};
  for (let k = from; k <= to; k = mAdd(k,1)) per[k] = {inc:0, exp:0};
  D.ops.forEach(o => {
    if (o.type==='Перевод') return;
    const mk = o.date.slice(0,7), s = o.type==='Доход' ? 1 : -1;
    if (mk < from){ start += s*o.amount; return; }
    if (mk > to) return;
    const b = o.type==='Доход' ? inc : exp;
    b[o.group] = b[o.group] || {};
    b[o.group][o.article] = (b[o.group][o.article]||0) + o.amount;
    if (o.type==='Доход') per[mk].inc += o.amount; else per[mk].exp += o.amount;
  });
  const toList = b => Object.keys(b).map(g => ({ group:g, total: sum(Object.values(b[g])), items: Object.entries(b[g]).map(([a,v])=>({a,v})).sort((x,y)=>y.v-x.v) })).sort((x,y)=>y.total-x.total);
  const inL = toList(inc), exL = toList(exp);
  const tIn = sum(inL,g=>g.total), tEx = sum(exL,g=>g.total);
  let run = start;
  const months = Object.keys(per).map(k => { const p = per[k]; const st = run; run += p.inc - p.exp; return { k, start: st, inc:p.inc, exp:p.exp, net:p.inc-p.exp, end: run }; });
  return { start, inL, exL, tIn, tEx, net: tIn - tEx, end: start + tIn - tEx, months };
}

/* экраны */
const TITLES = { home:'Обзор', ops:'Операции', pf:'План-факт', odds:'Движение денег' };
function render(){
  if (!D) return;
  const sub = S.tab==='odds' && S.odds!=='month' ? '<small>'+esc(periodLabel())+'</small>' : '';
  $('#mlabel').innerHTML = esc(mLabel(S.month)) + '<span class="sync" id="sync"></span>' + sub;
  document.querySelectorAll('.tab[data-v]').forEach(t => t.classList.toggle('on', t.dataset.v===S.tab));
  $('#view').innerHTML = `<h1 class="lt">${TITLES[S.tab]}</h1>` + (S.tab==='home' ? viewHome() : S.tab==='ops' ? viewOps() : S.tab==='pf' ? viewPF() : viewOdds());
  setSync(S.busy);
}
function setSync(on){ const s = $('#sync'); if (s) s.classList.toggle('on', !!on); }
function periodLabel(){ const [a,b] = oddsRange(); return a===b ? mLabel(a) : mShort(a)+' — '+mShort(b); }
function barCls(fact, plan, type){
  if (!plan) return fact ? (type==='Доход' ? 'good' : 'over') : '';
  const r = fact/plan;
  if (type==='Доход') return r>=1 ? 'good' : '';
  return r>1 ? 'over' : r>=.85 ? 'warn' : '';
}
const barW = (f,p) => p ? Math.min(100, f/p*100) : (f ? 100 : 0);
const bar = (f,p,t,cls) => `<div class="bar ${cls||''}"><i class="${barCls(f,p,t)}" style="width:${barW(f,p)}%"></i></div>`;
const sec = (title, right) => `<div class="sec"><h2>${title}</h2>${right||''}</div>`;

function opRow(o){
  const tr = o.type==='Перевод';
  const sub = tr ? (o.wallet+' → '+o.wallet2) : [o.group, o.wallet, o.cp].filter(Boolean).join(' · ');
  const amt = o.type==='Доход' ? money(o.amount,true) : tr ? money(o.amount) : money(-o.amount);
  return `<button class="row tap" data-act="edit" data-v="${esc(o.id)}">
    <span class="ico">${esc(tr ? '⇄' : artIcon(o.group,o.article))}</span>
    <span class="m"><div class="t">${esc(tr ? 'Перевод' : o.article)}</div><div class="s">${esc(sub)}${o.comment ? ' — '+esc(o.comment) : ''}</div></span>
    <span class="a ${o.type==='Доход'?'pos':tr?'l2':''}">${amt}</span></button>`;
}
const sortOps = a => a.slice().sort((x,y)=> y.date.localeCompare(x.date) || (y._t||0)-(x._t||0));

function viewHome(){
  const b = balances();
  const total = sum(Object.values(b));
  const mo = opsOfMonth(S.month);
  const inc = sum(mo.filter(o=>o.type==='Доход'), o=>o.amount);
  const exp = sum(mo.filter(o=>o.type==='Расход'), o=>o.amount);
  const pf = planFact(S.month,'Расход');
  const left = pf.plan - pf.fact;
  const isCur = S.month===today().slice(0,7);
  const dim = new Date(+S.month.slice(0,4), +S.month.slice(5,7), 0).getDate();
  const daysLeft = isCur ? dim - new Date().getDate() + 1 : 0;
  const recent = sortOps(mo).slice(0,5);
  const ws = D.wallets.slice().sort((x,y)=> (y.active?1:0)-(x.active?1:0));
  let hint = '', say = '';
  if (pf.plan){
    if (left < 0){ hint = `<span class="red">Перерасход ${money(-left)}</span>`; say = `Ой! Перерасход<br>${money(-left)}.`; }
    else {
      const perDay = isCur && daysLeft>0 ? Math.floor(left/daysLeft) : 0;
      hint = `Осталось <b class="num" style="font-weight:600;color:var(--label)">${money(left)}</b>` + (perDay ? ` · ≈ ${money(perDay)} в день` : '');
      say = perDay ? `Хрю! Можно тратить<br>≈ ${money(perDay)} в день.` : `Осталось<br>${money(left)}.`;
    }
  } else { hint = 'План на месяц не задан'; say = 'Хрю! Заполни план<br>на этот месяц.'; }
  if (!mo.length) say = 'Пусто. Жми [+],<br>начнём учёт.';
  return `
  <div class="hero">
    <div class="art">
      <div class="stripes">${[64,40,82,30,96,55,72,38,88,46,60,100,34,78].map(w=>`<i style="width:${w}%"></i>`).join('')}</div>
      <div class="bubble">${say}<span class="cur"></span></div>
      <div class="pig">${PIG_SVG}</div>
    </div>
    <div class="hero-txt">
      <div class="cap">Баланс на всех счетах</div>
      <div class="big num">${money(total)}</div>
      <div class="stats num"><span>${money(inc,true)} доход</span><span>${money(-exp)} расход</span>${pf.plan ? `<span>${Math.round(pf.fact/pf.plan*100)}% бюджета</span>` : ''}</div>
    </div>
  </div>

  ${sec('Бюджет', '<button class="link" data-act="tab" data-v="pf">Подробнее</button>')}
  <div class="card pad">
    <div class="spl" style="margin-bottom:8px"><span class="sub"><span class="num" style="font-weight:600">${money(pf.fact)}</span> <span class="l2">из ${money(pf.plan)}</span></span><span class="sub l2 num">${pf.plan ? Math.round(pf.fact/pf.plan*100)+'%' : ''}</span></div>
    ${bar(pf.fact,pf.plan,'Расход','lg')}
    <div class="fn l2" style="margin-top:8px">${hint}</div>
    ${pf.groups.length>1 ? '<div style="margin-top:6px">'+pf.groups.map(g=>`<div class="grp"><span>${esc(g.group)}</span>${bar(g.fact,g.plan,'Расход')}<span class="num">${nf.format(Math.round(g.fact))} / ${nf.format(g.plan)}</span></div>`).join('')+'</div>' : ''}
  </div>

  ${sec('Кошельки', '<button class="link" data-act="wallet-new">Добавить</button>')}
  <div class="card ic">
    ${ws.map(w=>`<button class="row tap" data-act="wallet" data-v="${esc(w.name)}">
      <span class="ico">${esc(w.icon||'💳')}</span>
      <span class="m"><div class="t ${w.active?'':'l2'}">${esc(w.name)}</div>${w.owner || !w.active ? `<div class="s">${esc([w.owner, w.active?'':'скрыт'].filter(Boolean).join(' · '))}</div>` : ''}</span>
      <span class="a ${(b[w.name]||0)<0?'red':''}">${money(b[w.name]||0)}</span>${DISC}</button>`).join('') || '<div class="empty">Кошельков пока нет</div>'}
  </div>

  ${sec('Последние операции', recent.length ? '<button class="link" data-act="tab" data-v="ops">Все</button>' : '')}
  <div class="card ic">${recent.length ? recent.map(opRow).join('') : '<div class="empty">В этом месяце операций нет.<br>Нажмите <span class="blue">＋</span>, чтобы добавить.</div>'}</div>`;
}

function viewOps(){
  let ops = opsOfMonth(S.month);
  const f = S.opsFilter;
  if (f!=='all') ops = ops.filter(o=>o.type===f);
  const seg = `<div class="seg">${[['all','Все'],['Расход','Расходы'],['Доход','Доходы'],['Перевод','Переводы']].map(([v,l])=>`<button class="${f===v?'on':''}" data-act="opsf" data-v="${v}">${l}</button>`).join('')}</div>`;
  if (!ops.length) return seg + `<div class="card" style="margin-top:20px"><div class="empty">Нет операций за ${esc(mLabel(S.month).toLowerCase())}</div></div>`;
  const byDay = {};
  sortOps(ops).forEach(o => (byDay[o.date] = byDay[o.date] || []).push(o));
  return seg + Object.keys(byDay).map(d => {
    const list = byDay[d];
    const dt = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
    const net = sum(list, o => o.type==='Доход' ? o.amount : o.type==='Расход' ? -o.amount : 0);
    const lbl = dLabel(d) + (d===today()||d===yesterday() ? '' : ', '+WD[dt.getDay()]);
    return `<div class="gh" style="display:flex;justify-content:space-between;text-transform:none;font-size:15px;margin:22px 4px 8px"><span style="color:var(--label);font-weight:600">${lbl}</span><span class="num">${net ? money(net,true) : ''}</span></div><div class="card ic">${list.map(opRow).join('')}</div>`;
  }).join('');
}

function viewPF(){
  const t = S.pfType;
  const pf = planFact(S.month, t);
  const seg = `<div class="seg"><button class="${t==='Расход'?'on':''}" data-act="pft" data-v="Расход">Расходы</button><button class="${t==='Доход'?'on':''}" data-act="pft" data-v="Доход">Доходы</button></div>`;
  const diff = t==='Расход' ? pf.plan - pf.fact : pf.fact - pf.plan;
  const head = `<div class="card pad" style="margin-top:16px"><div class="cols" style="margin:0;padding:0;box-shadow:none">
    <div><div class="k">План</div><div class="v">${money(pf.plan)}</div></div>
    <div><div class="k">Факт</div><div class="v">${money(pf.fact)}</div></div>
    <div><div class="k">${t==='Расход' ? (diff>=0?'Осталось':'Перерасход') : (diff>=0?'Сверх плана':'Недобор')}</div><div class="v ${diff<0?'red':'pos'}">${money(Math.abs(diff))}</div></div></div>
    <div style="margin-top:12px">${bar(pf.fact,pf.plan,t,'lg')}</div></div>`;
  if (!pf.groups.length) return seg + head + '<div class="card" style="margin-top:20px"><div class="empty">Статей нет — добавьте их на листе «Статьи».</div></div>';
  return seg + head + pf.groups.map(g => sec(esc(g.group), `<span class="v num">${money(g.fact)} из ${money(g.plan)}</span>`) + `
    <div class="card ic">${g.items.map(i => {
      const d = t==='Расход' ? i.plan - i.fact : i.fact - i.plan;
      const rest = !i.plan ? (i.fact ? (t==='Расход' ? '<span class="red">вне плана</span>' : 'вне плана') : 'план не задан')
        : t==='Расход' ? (d>=0 ? 'осталось '+money(d) : '<span class="red">перерасход '+money(-d)+'</span>')
        : (d>=0 ? '<span class="pos">выполнен</span>' : 'ещё '+money(-d));
      return `<div class="row"><span class="ico">${esc(i.icon||'•')}</span>

}

/* sheet */
function openSheet(title, done, body){
  $('#pages').classList.remove('push');
  $('#shTitle').textContent = title;
  $('#shDone').textContent = done;
  $('#shBody').innerHTML = body;
  $('#shBody').scrollTop = 0;
  $('#sheet').style.transform = '';
  $('#sheet').classList.add('on');
  $('#scrim').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (tg && tg.BackButton) tg.BackButton.show();
}
function closeSheet(){
  F = null; mode = null;
  $('#sheet').classList.remove('on');
  $('#sheet').style.transform = '';
  $('#scrim').classList.remove('on');
  $('#scrim').style.opacity = '';
  document.body.style.overflow = '';

  if (tg && tg.BackButton) tg.BackButton.hide();
}
function pushPage(title, body){
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#subTitle').textContent = title;
  $('#subBody').innerHTML = body;
  $('#subBody').scrollTop = 0;
  $('#pages').classList.add('push');
}
const popPage = () => $('#pages').classList.remove('push');
const isPushed = () => $('#pages').classList.contains('push');
function back(){ if (isPushed()) popPage(); else closeSheet(); }

// свайп вниз за шапку: 1:1, закрытие по расстоянию или скорости
(function(){
  const sh = $('#sheet'); let y0=0, dy=0, t0=0, v=0, on=false;
  const start = e => { if (e.target.closest('button')) return; on=true; y0=e.clientY; dy=0; t0=performance.now(); v=0; sh.classList.add('drag'); e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if(!on) return; const now=performance.now(); const ny=e.clientY-y0; v=(ny-dy)/Math.max(1,now-t0); t0=now; dy=ny;
    sh.style.transform = `translateY(${dy>0 ? dy : -Math.pow(-dy,.7)}px)`; $('#scrim').style.opacity = String(Math.max(0,1-dy/(sh.offsetHeight||600))); };
  const end = () => { if(!on) return; on=false; sh.classList.remove('drag'); $('#scrim').style.opacity=''; if (dy>140 || v>.6) closeSheet(); else sh.style.transform=''; };
  ['#grab','#shNav'].forEach(s => { const el=$(s); el.addEventListener('pointerdown',start); el.addEventListener('pointermove',move); el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); });
})();

function usage(t){
  const since = isoOf(new Date(Date.now()-90*864e5)), cnt = {};
  D.ops.forEach(o => { if (o.type===t && o.date>=since){ const k=akey(o.group,o.article); cnt[k]=(cnt[k]||0)+1; } });
  return cnt;
}
function defaultWallet(){

// живые подсказки: бюджет статьи и остаток кошелька после операции
function updInfo(){
  if (!F || mode!=='op') return;
  const amt = parseAmount(F.amount), a = amt>0 ? amt : 0;
  const t = F.type, m = F.date.slice(0,7), mi = +m.slice(5,7)-1;
  const art = t!=='Перевод' && F.article ? artOf(F.group, F.article) : null;
  const ai = $('#fArtInfo');
  if (ai){
    if (art){
      const plan = planOf(m, art.group, art.name), before = factOf(m, art.group, art.name, t, F.id), after = before + a;
      let res;
      if (!plan) res = `<span class="l2">План на ${MONTHS_PREP[mi]} не задан</span>`;
      else if (t==='Расход') res = after<=plan ? `<span class="l2">После операции останется</span> <b class="num" style="font-weight:600">${money(plan-after)}</b>` : `<span class="red">Перерасход по статье: ${money(after-plan)}</span>`;
      else res = after>=plan ? `<span class="pos">План по доходу выполнен</span>` : `<span class="l2">До плана ещё</span> <b class="num" style="font-weight:600">${money(plan-after)}</b>`;
      const over = plan && after>plan && t==='Расход';
      const w0 = plan ? Math.min(100, before/plan*100) : 0, w1 = plan ? Math.max(0, Math.min(100, after/plan*100) - w0) : 0;
      ai.innerHTML = `<div class="spl"><span>${t==='Расход'?'Потрачено':'Получено'} в ${MONTHS_PREP[mi]}</span><span class="num">${nf.format(before)}${a ? ' + '+nf.format(a) : ''} из ${nf.format(plan)}</span></div>
        <div class="bar"><i class="${barCls(before,plan,t)}" style="width:${w0}%"></i><i class="add ${over?'over':''}" style="width:${w1}%"></i></div>
        <div class="res">${res}</div>`;
      ai.hidden = false;
    } else ai.hidden = true;
  }
  const bal = balances(F.id);
  const winfo = (el, name, delta) => {
    if (!el) return;
    if (!name){ el.hidden = true; return; }
    const b0 = bal[name]||0, b1 = b0 + delta;
    el.innerHTML = `<div class="spl" style="margin:0"><span>Остаток</span><span class="num">${money(b0)}${a ? ' → <span style="color:'+(b1<0?'var(--red)':'var(--label)')+'">'+money(b1)+'</span>' : ''}</span></div>`;
    el.hidden = false;
  };
  winfo($('#fWalInfo'), F.wallet, t==='Доход' ? a : -a);
  winfo($('#fWal2Info'), F.wallet2, a);
  // подсказка под суммой и доступность кнопки
  const need = [];
  if (!(amt>0)) need.push('сумму');
  if (t==='Перевод'){ if (!F.wallet2) need.push('куда перевести'); } else if (!F.article) need.push('статью');
  if (!F.wallet) need.push('кошелёк');
  $('#fHint').innerHTML = need.length ? 'Укажите ' + need.join(', ') : esc(t==='Перевод' ? `${F.wallet} → ${F.wallet2}` : `${F.article} · ${F.wallet}`) + ' · ' + esc(dLabel(F.date).toLowerCase());
  $('#shDone').disabled = need.length > 0 || S.saving;
}

function parseAmount(s){
  s = String(s||'').replace(/\s/g,'').replace(/,/g,'.');
  if (!s || !/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return ('+s+')')(); return isFinite(v) ? Math.round(v*100)/100 : NaN; } catch(e){ return NaN; }
}
async function saveOp(){
  F.amount = $('#fAmount').value; F.cp = $('#fCp').value.trim(); F.comment = $('#fComment').value.trim();
  const amount = parseAmount(F.amount);
  if (!(amount > 0)) return fail('Введите сумму', '#fAmount');
  const tr = F.type==='Перевод';
  if (tr){ if (!F.wallet2 || F.wallet2===F.wallet) return fail('Выберите, куда перевести'); }
  else if (!F.article) return fail('Выберите статью');
  if (!F.wallet) return fail('Выберите кошелёк');
  const op = { id:F.id, type:F.type, amount, date:F.date, wallet:F.wallet, wallet2: tr?F.wallet2:'', group: tr?'':F.group, article: tr?'':F.article, cp:F.cp, comment:F.comment };
  await busy(async () => {
    const res = await api(F.id ? 'update' : 'add', { op });
    res._t = Date.now();
    const i = D.ops.findIndex(o=>o.id===res.id);
    if (i>=0) D.ops[i] = res; else D.ops.push(res);
    if (res.cp && D.counterparties.indexOf(res.cp)<0) D.counterparties.push(res.cp);
    last.wallet = op.wallet; saveLast();
    const wasNew = !F.id;
    cache(); haptic('success'); closeSheet();
    S.month = res.date.slice(0,7); render();
    hud(wasNew ? 'Добавлено' : 'Сохранено');
  });
}
async function deleteOp(){
  if (!F || !F.id) return;
  const id = F.id;
  if (!(await ask('Удалить эту операцию?'))) return;
  await busy(async () => {
    await api('delete', { id });
    D.ops = D.ops.filter(o=>o.id!==id);
    cache(); haptic('success'); closeSheet(); render(); hud('Удалено');
  });
}

    $('#wOwner').innerHTML = [''].concat(owners).map(o=>`<button class="chip ${o===F.owner?'on':''}" data-act="wowner" data-v="${esc(o)}">${o ? esc(o) : 'Не указан'}</button>`).join('');
    $('#wIconBig').textContent = F.icon;
  };
  F._upd = upd; upd();
  if (!w) setTimeout(()=>{ const a=$('#wName'); if (a && mode==='wallet') a.focus(); }, 450);
}
async function saveWallet(){
  const name = $('#wName').value.trim();
  const initial = $('#wInit').value.trim() ? parseAmount($('#wInit').value.replace('₽','')) : 0;
  if (!name) return fail('Введите название', '#wName');
  if (isNaN(initial)) return fail('Проверьте начальный остаток', '#wInit');
  if (D.wallets.some(w => w.name.toLowerCase()===name.toLowerCase() && w.name!==F.oldName)) return fail('Такой кошелёк уже есть', '#wName');
  const wallet = { name, initial, icon:F.icon, owner:F.owner, active: $('#wActive').checked };
  const isNew = !F.oldName, ret = F.ret;
  await busy(async () => {
    D = await api('saveWallet', { wallet, oldName: F.oldName });
    cache(); haptic('success'); render();
    if (ret){ closeSheet(); setTimeout(()=>{ openOp(ret.id ? D.ops.find(o=>o.id===ret.id) || null : null); Object.assign(F, ret, { wallet: isNew ? name : ret.wallet }); $('#fAmount').value = F.amount; if (F._fit) F._fit(); updOp(); }, 380); }
    else closeSheet();
    hud(isNew ? 'Кошелёк создан' : 'Сохранено');
  });
}

/* общее */
async function busy(fn){
  if (S.saving) return;
  S.saving = true; const b = $('#shDone'); b.disabled = true; const txt = b.textContent; b.textContent = '···';
  try { await fn(); }
  catch(e){ haptic('error'); hud(e.message || 'Не удалось сохранить'); }
  finally { S.saving = false; b.textContent = txt; b.disabled = false; if (mode==='op') updInfo(); }
}
function fail(msg, focus){ haptic('error'); hud(msg); if (focus){ const el=$(focus); if (el) el.focus(); } }
function ask(msg){
  return new Promise(res => {
    if (inTg && tg.showConfirm && tg.isVersionAtLeast('6.2')) tg.showConfirm(msg, ok => res(!!ok));
    else res(window.confirm(msg));
  });
}
function haptic(kind){ try{ if (!inTg || !tg.HapticFeedback) return; if (kind) tg.HapticFeedback.notificationOccurred(kind); else tg.HapticFeedback.selectionChanged(); }catch(e){} }
let hudT;
function hud(msg){ const t=$('#hud'); t.textContent = msg; t.classList.add('on'); clearTimeout(hudT); hudT = setTimeout(()=>t.classList.remove('on'), 2000); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch(a){
    case 'tab': if (S.tab!==v){ S.tab = v; render(); window.scrollTo(0,0); haptic(); } break;
    case 'month': S.month = mAdd(S.month, +v); render(); haptic(); break;
    case 'opsf': S.opsFilter = v; render(); haptic(); break;
    case 'pft': S.pfType = v; render(); haptic(); break;
    case 'odds': S.odds = v; render(); haptic(); break;
    case 'new': haptic(); openOp(null); break;
    case 'edit': { const o = D.ops.find(x=>x.id===v); if (o) openOp(o); break; }
    case 'wallet': openWallet(v); break;
    case 'wallet-new': openWallet(null, mode==='op'); break;
    case 'close': closeSheet(); break;
    case 'back': popPage(); break;
    case 'done': if (mode==='op') saveOp(); else if (mode==='wallet') saveWallet(); break;
    case 'delete': deleteOp(); break;
    case 'ftype': if (F.type!==v){ F.type = v; F.group=''; F.article=''; if (v!=='Перевод') F.wallet2=''; updOp(); haptic(); } break;
    case 'fpick': { const same = F.group===el.dataset.g && F.article===v; F.group = same ? '' : el.dataset.g; F.article = same ? '' : v; updOp(); haptic(); break; }
    case 'pick-art': pickArticle(); break;
    case 'pick-wal': pickWallet(1); break;
    case 'pick-wal2': pickWallet(2); break;
    case 'set-art': F.group = el.dataset.g; F.article = v; haptic(); popPage(); updOp(); break;
    case 'set-wal': if (el.dataset.w==='2') F.wallet2 = v; else { F.wallet = v; if (F.wallet2===v) F.wallet2=''; } haptic(); popPage(); updOp(); break;
    case 'wicon': F.icon = v; F._upd(); haptic(); break;
    case 'wowner': F.owner = v; F._upd(); haptic(); break;
    case 'retry': start(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.matches('.sheet input')) e.target.blur(); });
window.addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', window.scrollY > 4), { passive:true });

/* запуск */
function cache(){ if (!DEMO && D) LS.set('fb_data', JSON.stringify(D)); }
function screen(icon, title, text, btn){
  $('#nav').hidden = true; $('#tabs').hidden = true;
  $('#view').innerHTML = `<div class="screen"><div class="big">${icon}</div><h2>${title}</h2><p>${text}</p>${btn||''}</div>`;
}
function skeleton(){ $('#view').innerHTML = '<h1 class="lt">Обзор</h1><div class="skel" style="height:150px"></div><div class="skel" style="height:140px;margin-top:50px"></div><div class="skel" style="height:180px;margin-top:50px"></div>'; }
async function start(){
  $('#nav').hidden = false; $('#tabs').hidden = false;
  if (DEMO) $('#demoBar').hidden = false;
  else if (!inTg) return screen('📱','Откройте в Telegram','Это мини-приложение семейного бюджета. Откройте его кнопкой «Бюджет» в вашем боте.','<a class="btn" href="?demo=1">Посмотреть демо</a>');
  else if (!API) return screen('🔌','Приложение не подключено','В Google Таблице выберите меню «💰 Бюджет» → «3. Подключить приложение к боту» и откройте приложение заново.');
  if (!D && !DEMO){ try { D = JSON.parse(LS.get('fb_data')||'null'); } catch(e){ D = null; } }
  if (D) render(); else skeleton();
  S.busy = true; setSync(true);
  try{ D = await api('load', {}); cache(); render(); }
  catch(e){
    if (e.code==='forbidden') return screen('🔐','Нужен доступ', `Ваш Telegram ID: <code>${esc(e.tgId)}</code><br><br>Откройте Google Таблицу → лист «Доступ» и включите «Разрешён» в вашей строке.`, '<button class="btn" data-act="retry">Обновить</button>');
    if (!D) return screen('⚠️','Не удалось загрузить', esc(e.message||'Ошибка сети'), '<button class="btn" data-act="retry">Повторить</button>');
    hud('Нет связи — показаны сохранённые данные');
  }finally{ S.busy = false; setSync(false); }
}
if (tg){
  try{
    tg.ready(); tg.expand();
    if (inTg && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.BackButton.onClick(back);
    tg.onEvent('themeChanged', applyTheme);
  }catch(e){}
}

/* ДЕМО */
let DEMO_DB = null;
function demoApi(action, p){
  return new Promise(res => setTimeout(() => {
    if (!DEMO_DB) DEMO_DB = demoData();
    if (action==='load') res(JSON.parse(JSON.stringify(DEMO_DB)));
    else if (action==='delete') res({ id:p.id });
    else if (action==='saveWallet'){
      const db = JSON.parse(JSON.stringify(D)), w = p.wallet;
      if (p.oldName){ const x = db.wallets.find(z=>z.name===p.oldName); Object.assign(x, w);
        if (p.oldName!==w.name) db.ops.forEach(o=>{ if(o.wallet===p.oldName) o.wallet=w.name; if(o.wallet2===p.oldName) o.wallet2=w.name; }); }
      else db.wallets.push(w);
      DEMO_DB = db; res(JSON.parse(JSON.stringify(db)));
    }
    else res({ ...p.op, id: p.op.id || Math.random().toString(36).slice(2,12), author:'Демо' });
  }, 300));
}
function demoData(){
  const A = [['Люся','Зарплата','Доход','💼',150000],['Кирилл','Зарплата','Доход','💼',190000],['Общие','Прочие доходы','Доход','💰',0],
    ['Люся','Ногти','Расход','💅',5000],['Люся','Брови','Расход','✨',1000],['Люся','Волосы','Расход','💇‍♀️',3500],['Люся','Обеды','Расход','🍱',10000],

    ['Общие','Коммуналка','Расход','🏠',5000],['Общие','Еда','Расход','🛒',50000],['Общие','Развлечения','Расход','🎉',5000],['Общие','Кафе','Расход','☕',10000],['Общие','Подарки','Расход','🎁',10000]];
  const articles = A.map(a=>({group:a[0],name:a[1],type:a[2],icon:a[3],active:true}));
  const wallets = [{name:'Карта Кирилла',owner:'Кирилл',initial:85000,icon:'💳',active:true},{name:'Карта Люси',owner:'Люся',initial:42000,icon:'💳',active:true},{name:'Наличные',owner:'Общие',initial:7000,icon:'💵',active:true}];
  const cur = today().slice(0,7), prev = mAdd(cur,-1);
  const budget = {};
  [mAdd(cur,-2),prev,cur,mAdd(cur,1)].forEach(m => { budget[m] = {}; A.forEach(a=>{ if (a[4]) budget[m][akey(a[0],a[1])] = a[4]; }); });
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const ops = []; let n = 0;

  return { user:{id:1,name:'Кирилл',group:'',wallet:''}, articles, wallets, counterparties:['Пятёрочка','ВкусВилл','Кофейня','Ростелеком','Мосэнергосбыт'], budget, ops };
}
